<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purple Flower 💜</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(circle at 50% 55%,
        #32105c 0%,
        #160526 35%,
        #050108 75%);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Main scene */
.scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

/* Soft light behind flower */
.glow {
    position: absolute;
    left: 50%;
    top: 46%;
    width: 330px;
    height: 330px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: rgba(168, 85, 247, 0.16);
    filter: blur(50px);
    animation: breathing 4s ease-in-out infinite;
}

/* Ground glow */
.ground {
    position: absolute;
    left: 50%;
    bottom: 7%;
    width: 260px;
    height: 35px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: rgba(168, 85, 247, 0.28);
    filter: blur(18px);
}

/* Flower */
.flower {
    position: absolute;
    left: 50%;
    bottom: 10%;
    width: 280px;
    height: 570px;
    transform: translateX(-50%);
}

/* Stem */
.stem {
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 10px;
    height: 390px;
    transform-origin: bottom;
    transform: translateX(-50%) rotate(-2deg);
    border-radius: 20px;
    background: linear-gradient(
        to right,
        #102d18,
        #4d913c,
        #18351d
    );
    box-shadow: 0 0 10px rgba(70, 150, 60, .3);
    animation: stemMove 5s ease-in-out infinite;
}

/* Leaves */
.leaf {
    position: absolute;
    width: 120px;
    height: 55px;
    border-radius: 100% 0 100% 0;
    background: linear-gradient(
        135deg,
        #70b84e,
        #285b2b 70%
    );
    box-shadow: 0 0 12px rgba(75, 160, 65, .25);
}

.leaf.left {
    left: 25px;
    bottom: 190px;
    transform: rotate(-28deg);
    animation: leafLeft 5s ease-in-out infinite;
}

.leaf.right {
    right: 18px;
    bottom: 270px;
    transform: scaleX(-1) rotate(-25deg);
    animation: leafRight 5s ease-in-out infinite;
}

/* Flower head */
.flower-head {
    position: absolute;
    left: 50%;
    top: 0;
    width: 280px;
    height: 280px;
    transform: translateX(-50%);
    animation: flowerFloat 4s ease-in-out infinite;
}

/* Individual petals */
.petal {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 78px;
    height: 145px;
    transform-origin: 50% 100%;
    border-radius: 65% 65% 45% 45%;
    background:
        radial-gradient(
            ellipse at 50% 20%,
            #f0c9ff 0%,
            #c084fc 25%,
            #9333ea 60%,
            #581c87 100%
        );
    box-shadow:
        inset 0 0 15px rgba(255,255,255,.25),
        0 0 18px rgba(168,85,247,.65);
    opacity: 0;
    animation: petalOpen 1.8s cubic-bezier(.2,.8,.2,1) forwards;
}

/* Petal positions */
.p1 {
    transform: translate(-50%, -100%) rotate(0deg);
    animation-delay: .2s;
}

.p2 {
    transform: translate(-50%, -100%) rotate(45deg);
    animation-delay: .35s;
}

.p3 {
    transform: translate(-50%, -100%) rotate(90deg);
    animation-delay: .5s;
}

.p4 {
    transform: translate(-50%, -100%) rotate(135deg);
    animation-delay: .65s;
}

.p5 {
    transform: translate(-50%, -100%) rotate(180deg);
    animation-delay: .8s;
}

.p6 {
    transform: translate(-50%, -100%) rotate(225deg);
    animation-delay: .95s;
}

.p7 {
    transform: translate(-50%, -100%) rotate(270deg);
    animation-delay: 1.1s;
}

.p8 {
    transform: translate(-50%, -100%) rotate(315deg);
    animation-delay: 1.25s;
}

/* Flower center */
.center {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 62px;
    height: 62px;
    transform: translate(-50%, -50%) scale(0);
    border-radius: 50%;
    background:
        radial-gradient(
            circle at 35% 30%,
            #fff4b0,
            #ffd84d 35%,
            #d99100 75%,
            #7a3d00
        );
    box-shadow:
        0 0 18px #ffd84d,
        0 0 40px rgba(255,216,77,.5);
    z-index: 10;
    animation: centerAppear 1s 1.5s cubic-bezier(.2,.8,.2,1) forwards;
}

/* Tiny dots inside center */
.center::before {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    background:
        radial-gradient(circle, #fff7c2 2px, transparent 3px);
    background-size: 9px 9px;
    opacity: .7;
}

/* Floating particles */
.particle {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #e9d5ff;
    box-shadow:
        0 0 8px #c084fc,
        0 0 16px #a855f7;
    pointer-events: none;
    animation: particleFloat linear infinite;
}

.p1x { left: 18%; bottom: 15%; animation-duration: 5s; }
.p2x { left: 27%; bottom: 30%; animation-duration: 7s; animation-delay: 1s; }
.p3x { left: 72%; bottom: 18%; animation-duration: 6s; animation-delay: 2s; }
.p4x { left: 82%; bottom: 35%; animation-duration: 8s; animation-delay: .5s; }
.p5x { left: 40%; bottom: 8%; animation-duration: 6s; animation-delay: 1.5s; }
.p6x { left: 63%; bottom: 25%; animation-duration: 7s; animation-delay: 3s; }
.p7x { left: 12%; bottom: 45%; animation-duration: 9s; animation-delay: 2s; }
.p8x { left: 88%; bottom: 50%; animation-duration: 6s; animation-delay: 1s; }

/* Animations */
@keyframes petalOpen {
    0% {
        opacity: 0;
        transform: translate(-50%, -100%) rotate(var(--rotation))
                   scale(.1);
    }

    65% {
        opacity: 1;
    }

    100% {
        opacity: 1;
        transform: translate(-50%, -100%) rotate(var(--rotation))
                   scale(1);
    }
}

@keyframes centerAppear {
    0% {
        transform: translate(-50%, -50%) scale(0);
    }

    70% {
        transform: translate(-50%, -50%) scale(1.15);
    }

    100% {
        transform: translate(-50%, -50%) scale(1);
    }
}

@keyframes flowerFloat {
    0%, 100% {
        transform: translateX(-50%) translateY(0) rotate(-1deg);
    }

    50% {
        transform: translateX(-50%) translateY(-7px) rotate(1deg);
    }
}

@keyframes stemMove {
    0%, 100% {
        transform: translateX(-50%) rotate(-2deg);
    }

    50% {
        transform: translateX(-50%) rotate(2deg);
    }
}

@keyframes leafLeft {
    0%, 100% {
        transform: rotate(-28deg);
    }

    50% {
        transform: rotate(-34deg);
    }
}

@keyframes leafRight {
    0%, 100% {
        transform: scaleX(-1) rotate(-25deg);
    }

    50% {
        transform: scaleX(-1) rotate(-19deg);
    }
}

@keyframes breathing {
    0%, 100% {
        opacity: .5;
        transform: translate(-50%, -50%) scale(.9);
    }

    50% {
        opacity: .9;
        transform: translate(-50%, -50%) scale(1.12);
    }
}

@keyframes particleFloat {
    0% {
        opacity: 0;
        transform: translateY(50px) scale(.3);
    }

    20% {
        opacity: 1;
    }

    80% {
        opacity: .8;
    }

    100% {
        opacity: 0;
        transform: translateY(-350px) scale(1.2);
    }
}

/* Small screens */
@media (max-width: 500px) {
    .flower {
        transform: translateX(-50%) scale(.82);
        transform-origin: bottom center;
    }

    .glow {
        width: 270px;
        height: 270px;
    }
}
</style>
</head>

<body>

<div class="scene">

    <div class="glow"></div>
    <div class="ground"></div>

    <!-- Floating purple particles -->
    <div class="particle p1x"></div>
    <div class="particle p2x"></div>
    <div class="particle p3x"></div>
    <div class="particle p4x"></div>
    <div class="particle p5x"></div>
    <div class="particle p6x"></div>
    <div class="particle p7x"></div>
    <div class="particle p8x"></div>

    <!-- Flower -->
    <div class="flower">

        <div class="stem"></div>

        <div class="leaf left"></div>
        <div class="leaf right"></div>

        <div class="flower-head">

            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>
            <div class="petal p5"></div>
            <div class="petal p6"></div>
            <div class="petal p7"></div>
            <div class="petal p8"></div>

            <div class="center"></div>

        </div>
    </div>

</div>

</body>
</html>
